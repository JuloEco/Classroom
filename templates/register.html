{% extends 'base.html' %}
{% block content %}
<div class="flex items-center justify-center pt-12">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-100">
        <h2 class="text-2xl font-bold text-center text-gray-900 mb-6">Créer un compte</h2>
        
        <form method="POST" action="{{ url_for('register') }}" class="space-y-5">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Nom d'utilisateur</label>
                <input type="text" name="username" id="username" required 
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                       placeholder="Ex: JeanDupont">
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
                <input type="password" name="password" id="password" required 
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                       placeholder="••••••••">
            </div>

            <div>
                <label for="role" class="block text-sm font-medium text-gray-700 mb-1">Vous êtes :</label>
                <select name="role" id="role" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-md bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                    <option value="" disabled selected>Choisissez votre profil...</option>
                    <option value="eleve">🎓 Élève</option>
                    <option value="prof">👨‍🏫 Enseignant / Professeur</option>
                </select>
            </div>
            
            <button type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-md shadow transition duration-150">
                S'inscrire
            </button>
        </form>
        
        <p class="mt-6 text-center text-sm text-gray-600">
            Déjà inscrit ? 
            <a href="{{ url_for('login') }}" class="text-indigo-600 hover:underline font-medium">Connectez-vous ici</a>
        </p>
    </div>
</div>
{% endblock %}
