{% extends 'base.html' %}
{% block content %}

<div class="max-w-7xl mx-auto pt-4">
    <div class="border-b border-gray-200 pb-4 mb-6">
        <h1 class="text-2xl font-bold text-gray-900">🧪 Le Bac à Sable Python (Sandbox)</h1>
        <p class="text-sm text-gray-500 mt-0.5">Testez vos algorithmes, manipulez vos variables et observez le résultat en direct.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 h-[calc(100vh-220px)] min-h-[450px]">
        
        <form method="POST" action="{{ url_for('sandbox') }}" class="flex flex-col h-full bg-slate-900 rounded-xl p-4 shadow-md">
            <input type="hidden" name="run_code" value="1">
            <div class="flex items-center justify-between pb-2 border-b border-slate-800 mb-2">
                <span class="text-xs font-mono text-slate-400">📝 script.py</span>
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-1.5 rounded-lg transition shadow-sm flex items-center gap-1">
                    ▶️ Exécuter le code
                </button>
            </div>
            <textarea name="code" class="w-full flex-grow bg-slate-950 text-slate-200 font-mono text-xs p-3 rounded-lg outline-none resize-none border border-slate-800 focus:border-indigo-500" spellcheck="false" rows="15">{{ code }}</textarea>
        </form>

        <div class="flex flex-col h-full bg-slate-950 rounded-xl p-4 shadow-md border border-slate-800">
            <div class="flex items-center pb-2 border-b border-slate-800 mb-2">
                <span class="text-xs font-mono text-slate-400">💻 Console de sortie</span>
            </div>
            <pre class="w-full flex-grow font-mono text-xs p-3 rounded-lg overflow-auto bg-slate-900 {% if '❌' in output %}text-red-400{% else %}text-emerald-400{% endif %}">{% if output %}{{ output }}{% else %}# En attente d'exécution...{% endif %}</pre>
        </div>

    </div>
</div>

{% endblock %}
