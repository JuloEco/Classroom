{% extends 'base.html' %}
{% block content %}
<div class="flex items-center justify-center pt-12">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-100">
        <h2 class="text-2xl font-bold text-center text-gray-900 mb-6">Connexion à votre espace</h2>
        
        <form method="POST" action="{{ url_for('login') }}" class="space-y-5">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Nom d'utilisateur</label>
                <input type="text" name="username" id="username" required 
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                       placeholder="Ex: prof1 ou eleve1">
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
                <input type="password" name="password" id="password" required 
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                       placeholder="••••••••">
            </div>
            
            <button type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-md shadow transition duration-150">
                Se connecter
            </button>
        </form>
        <p class="mt-4 text-center text-sm text-gray-600">
    Nouveau sur la plateforme ? 
    <a href="{{ url_for('register') }}" class="text-indigo-600 hover:underline font-medium">Créer un compte</a>
</p>
        <div class="mt-6 p-3 bg-gray-50 rounded-lg text-xs text-gray-500 text-center">
            <p class="font-semibold mb-1">Identifiants de test fournis :</p>
            <p>Enseignant : <span class="font-mono bg-gray-200 px-1 rounded">prof1</span> / <span class="font-mono bg-gray-200 px-1 rounded">password123</span></p>
            <p class="mt-1">Élève : <span class="font-mono bg-gray-200 px-1 rounded">eleve1</span> / <span class="font-mono bg-gray-200 px-1 rounded">password123</span></p>
        </div>
    </div>
</div>
{% endblock %}
